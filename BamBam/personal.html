<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>personal</title>
    <link rel="stylesheet" href="css/personal.css">
</head>
<body>
    <mi-header></mi-header>
    <main class="contenido">
        <section class="inicio">
            
            <div class="inicio_texto">
                <h1>
                    Control del personal
                </h1>
                <span>Entradas y salidas del turno · lunes, 2 de noviembre</span>

            </div>
            <div class="inicio_usuario">
                <p>Usuario: Alonso</p>
            </div>

        </section>

        <section class="tarjetas">

            <div class="tarjeta">
                <h3>Presentes ahora</h3>
                <p>1</p>
            </div>
        
            <div class="tarjeta">
                <h3>Sin registrar</h3>
                <p>3</p>
            </div>
        
            <div class="tarjeta_retardo">
                <h3>Retardos</h3>
                <p>0</p>
            </div>

        </section>

        <section class="tabla-personal">
            <table>
                <thead>
                    <tr>
                        <th>Empleado</th>
                        <th>Puesto</th>
                        <th>Turno</th>
                        <th>Entrada</th>
                        <th>Salida</th>
                        <th>Estado</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tablaPersonal"></tbody>
            </table>
        </section>

    </main>
    <footer></footer>
    <script src="js/sesion.js"></script>
    <script src="components/header.js"></script>
    <script src="js/personal.js"></script>
</body>
</html>
