<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/inventario.css">
</head>

<body>

    <header>

        <mi-header></mi-header>

    </header>

    <main class="contenido">
        <section class="inicio">
            
            <div class="inicio_texto">
                <h1>
                    Inventario
                </h1>
            </div>
            <div class="inicio_usuario">
                <p>Usuario: Alonso</p>
            </div>

        </section>
        <section class="tabla_contenedor">
            <table class="tabla_inventario">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Cantidad</th>
                        <th>Unidad</th>
                        <th>Estado</th>
                        <th>Actualizado</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tablaInventario"></tbody>
            </table>
        </section>
        <div class="contenedor-botones">
            <button class="button" id="btnAceptar" type="button">Guardar cambios</button>
            <button class="button" id="btnNuevo" type="button">Agregar insumo</button>
            <button class="button" id="btnCancelar" type="button">Cancelar</button>
        </div>

    </main>
    <footer></footer>
    <script src="js/sesion.js"></script>
    <script src="components/header.js"></script>
    <script src="js/inventario.js"></script>
</body>

</html>
