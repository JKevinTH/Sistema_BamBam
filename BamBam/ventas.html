<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/ventas.css">
</head>
<body>

    <header>

        <mi-header></mi-header>

    </header>

    <main class="contenido">

        <section class="inicio">
            
            <div class="inicio_texto">
                <h1>Ventas</h1>
                <label for="venta">No. de venta: 01</label>
            </div>
            <div class="inicio_usuario">
                <p>Usuario: Alonso</p>
            </div>

        </section>

        <section class="formulario-venta">
        
            <div class="campo">
                <label for="producto">Producto</label>
                <input type="text" id="producto">
            </div>
        
            <div class="campo">
                <label for="cantidad">Cantidad</label>
                <input type="text" id="cantidad">
            </div>
        
            <div class="campo">
                <label for="descuento">Descuento</label>
                <input type="text" id="descuento">
            </div>
        
            <div class="campo">
                <label for="precio">Precio</label>
                <input type="text" id="precio" step="0.01">
            </div>
        
            <div class="campo">
                <label for="pago">Tipo de pago</label>
                <select id="pago">
                    <option value="Efectivo">Efectivo</option>
                    <option value="Tarjeta">Tarjeta</option>
                    <option value="Transferencia">Transferencia</option>
                </select>
            </div>

            <div class="campo-btn">
                <button>Agregar Venta</button>
            </div>

        </section>

        <section class="tabla_contenedor">
            <table class="tabla_venta">
                <thead>
                    <tr>
                        <th>No. venta</th>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Descuento</th>
                        <th>Precio</th>
                        <th>Tipo de pago</th>
                    </tr>  
                </thead>

                <tr>
                    <td colspan="6">No hay produntos vendidos</td>
                </tr>
                
            </table>
        </section>

        <section class="botones">
            
            <a href="#" class="boton-finalizar">Finalizar</a>
            <a href="#" class="boton-editar">Editar</a>
            <a href="#" class="boton-cancelar">Cancelar</a>
            
            
        </section>

    </main>
    <footer></footer>
    <script src="components/header.js"></script>
</body>
</html>
